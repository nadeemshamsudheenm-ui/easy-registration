# ==============================================================================
# EASY REGISTRATION - APPLICATION CONFIGURATION
# ==============================================================================

server.port=${PORT:8080}
spring.application.name=EasyRegistration

# ------------------------------------------------------------------------------
# MySQL Database Configuration
# ------------------------------------------------------------------------------
# Default is local MySQL on port 3306.
# On cloud hosts like Render/Railway, these can be overridden via Environment Variables:
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/easyregistration?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------------------------
# JPA / Hibernate Configuration
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ------------------------------------------------------------------------------
# Session & Web Settings
# ------------------------------------------------------------------------------
server.servlet.session.timeout=120m
server.servlet.session.cookie.name=EASYREG_SESSION
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ------------------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------------------
logging.level.com.easyreg=INFO
logging.level.org.springframework.web=INFO
